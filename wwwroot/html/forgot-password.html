        <h1>Восстановление пароля</h1>

        <p class="description">
            Укажите почту, которую использовали при регистрации.
        </p>

        <div class="notice" id="form-message" hidden>
            <span id="form-message-text"></span>
        </div>

        <form class="recovery-form" method="post" novalidate>
            <label for="email">Электронная почта</label>
            <input
                type="email"
                id="email"
                placeholder="name@example.com"
                required
            >
            <p class="field-message" id="email-error"></p>

            <button type="submit" id="submit-button">
                <span class="spinner" id="submit-spinner" hidden></span>
                <span id="submit-text">Отправить ссылку</span>
            </button>
        </form>

        <a class="back-link" href="login.html">← Вернуться ко входу</a>

        <p class="hint">
            На эту почту придёт ссылка для установки нового пароля.
        </p>
